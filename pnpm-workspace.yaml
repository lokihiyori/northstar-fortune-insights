allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false

# Security override: GHSA-ggr8-5vv4-36mx / CVE-2026-40345 (high) — stack exhaustion in
# deepmerge-ts < 8.0.0. The vulnerable copy is transitive and unreachable from application
# code: @prisma/config imports only the `deepmerge` export and passes it to c12 as the
# config merger. @prisma/config@7.9.1 pins deepmerge-ts to the exact version 7.1.5, so
# Dependabot could not raise it (security_update_not_possible), and prisma@7.9.1 is still
# the latest stable release. Scoped to that one parent so nothing else silently moves.
# Remove once a stable Prisma release depends on deepmerge-ts >= 8.0.0.
overrides:
  "@prisma/config@7.9.1>deepmerge-ts": "8.0.1"
